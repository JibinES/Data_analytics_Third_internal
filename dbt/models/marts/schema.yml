version: 2

models:
  - name: fact_event
    description: One row per cleaned event.
    columns:
      - name: event_ts
        tests: [not_null]
      - name: event_type
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_event_type')
                field: event_type
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: session_id
        tests: [not_null]
      - name: price
        tests: [not_null]

  - name: dim_user
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: cohort_week
        tests: [not_null]

  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: dim_event_type
    columns:
      - name: event_type
        tests: [unique, not_null]

  - name: fct_sessions
    description: One row per session.
    columns:
      - name: session_id
        tests: [unique, not_null]
      - name: events
        tests: [not_null]
